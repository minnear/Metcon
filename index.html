<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker & Trend Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-gray: #64748b;
      --accent-red: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      margin-top: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    button {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .badge-up { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
    .badge-neutral { background-color: rgba(100, 116, 139, 0.2); color: var(--accent-gray); }
    .badge-down { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
  </style>
</head>
<body>

<div class="container">
  <h1>Workout Progress Tracker</h1>

  <!-- Log Session Form -->
  <div class="card">
    <h2>Log Completed Session</h2>
    <form id="workout-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="workout-date">Date</label>
          <input type="date" id="workout-date" required>
        </div>
        <div class="form-group">
          <label for="workout-name">Workout Name</label>
          <input type="text" id="workout-name" placeholder="e.g., Upper Body Strength" required>
        </div>
        <div class="form-group">
          <label for="total-volume">Total Volume (lbs)</label>
          <input type="number" id="total-volume" placeholder="14200" required>
        </div>
        <div class="form-group">
          <label for="duration">Duration (mins)</label>
          <input type="number" id="duration" placeholder="45" required>
        </div>
        <div class="form-group">
          <label for="notes">Progression Notes</label>
          <input type="text" id="notes" placeholder="e.g., +5 lbs Bench Press top set">
        </div>
      </div>
      <button type="submit">Save Session</button>
    </form>
  </div>

  <!-- History & Trending Progress Table -->
  <div class="card">
    <h2>History & Trending Indicators</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Workout Name</th>
          <th>Key Volume</th>
          <th>Work Rate</th>
          <th>Trend Indicator</th>
          <th>Progression Notes</th>
        </tr>
      </thead>
      <tbody id="history-table-body">
        <!-- Rendered via JavaScript -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // Initial local storage hydration or default schema seed
  const defaultLogs = [
    { id: 1, date: "2026-08-24", name: "Active Recovery / Deload", volume: 8100, duration: 30, notes: "Scheduled Deload Session" },
    { id: 2, date: "2026-08-27", name: "Upper Body Strength", volume: 13625, duration: 50, notes: "Added 1 rep across all Rows sets" },
    { id: 3, date: "2026-08-30", name: "Lower Body Hypertrophy", volume: 18500, duration: 60, notes: "Maintained Squat weight & reps" },
    { id: 4, date: "2026-09-02", name: "Upper Body Strength", volume: 14200, duration: 45, notes: "+5 lbs Bench Press top set" }
  ];

  function getLogs() {
    const data = localStorage.getItem('workout_logs');
    return data ? JSON.parse(data) : defaultLogs;
  }

  function saveLogs(logs) {
    localStorage.setItem('workout_logs', JSON.stringify(logs));
  }

  // Set today's date in input by default
  document.getElementById('workout-date').valueToDate = new Date();
  document.getElementById('workout-date').value = new Date().toISOString().substring(0, 10);

  // Calculate Rolling Average Baseline (3-4 prior sessions)
  function calculateVolumeTrend(currentVolume, previousLogs) {
    if (previousLogs.length === 0) {
      return { percentage: 0, badgeClass: 'badge-neutral', icon: '⚪ ➡️', text: '0.0%' };
    }

    // Take up to 4 most recent previous logs for rolling average
    const recent = previousLogs.slice(-4);
    const avgVolume = recent.reduce((sum, item) => sum + item.volume, 0) / recent.length;

    const delta = ((currentVolume - avgVolume) / avgVolume) * 100;
    const formattedDelta = (delta > 0 ? '+' : '') + delta.toFixed(1) + '%';

    if (delta >= 1.5) {
      return { badgeClass: 'badge-up', icon: '🟢 ↗️', text: formattedDelta };
    } else if (delta <= -5.0) {
      return { badgeClass: 'badge-down', icon: '🔵 ↘️', text: formattedDelta };
    } else {
      return { badgeClass: 'badge-neutral', icon: '⚪ ➡️', text: formattedDelta };
    }
  }

  function renderHistory() {
    const logs = getLogs();
    // Sort chronologically ascending to compute trends
    logs.sort((a, b) => new Date(a.date) - new Date(b.date));

    const tbody = document.getElementById('history-table-body');
    tbody.innerHTML = '';

    // Render newest entries at the top
    const renderList = [...logs].reverse();

    renderList.forEach((log) => {
      // Find prior entries relative to this log's date
      const priorLogs = logs.filter(l => new Date(l.date) < new Date(log.date));
      const trend = calculateVolumeTrend(log.volume, priorLogs);
      
      // Calculate Density Index (lbs per minute)
      const workRate = (log.volume / log.duration).toFixed(0);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${log.date}</td>
        <td><strong>${log.name}</strong></td>
        <td>${log.volume.toLocaleString()} lbs</td>
        <td>${workRate} lbs/min</td>
        <td><span class="badge ${trend.badgeClass}">${trend.icon} ${trend.text}</span></td>
        <td>${log.notes || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Handle Form Submission
  document.getElementById('workout-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const logs = getLogs();

    const newLog = {
      id: Date.now(),
      date: document.getElementById('workout-date').value,
      name: document.getElementById('workout-name').value,
      volume: parseFloat(document.getElementById('total-volume').value),
      duration: parseFloat(document.getElementById('duration').value),
      notes: document.getElementById('notes').value
    };

    logs.push(newLog);
    saveLogs(logs);
    renderHistory();

    // Reset Form Fields
    document.getElementById('workout-name').value = '';
    document.getElementById('total-volume').value = '';
    document.getElementById('duration').value = '';
    document.getElementById('notes').value = '';
  });

  // Initial render on load
  renderHistory();
</script>

</body>
</html>
